robot_config: ../robot/three_segment_nine_tendon.yaml
mujoco_xml: ../../assets/mujoco/multi_task_patent_demo.xml
output_directory: ../../outputs/drive_workspace_diagnostics
arms: [executor, observer]
scopes: [mechanical]
feedback:
  centerline_source: pcc
  tip_pose_source: mujoco
criteria:
  control_period_s: 0.05
  # 等待窗口不含解析轨迹时间、稳定确认时间和稳定后的保持时间。
  maximum_settle_s: 10.0
  stable_hold_s: 0.5
  target_tolerance_per_m: 0.001
  joint_speed_tolerance_radps: 0.001
  tendon_speed_tolerance_mps: 0.000001
  tip_speed_tolerance_mps: 0.00001
  minimum_clearance_m: 0.0005
dynamic:
  seed: 20260910
  combination_samples: 4
  # 测试工况不代表硬件能力；短行程不保证达到指定峰值速度。
  speeds_mps: [0.001, 0.002, 0.005]
  acceleration_time_s: 0.5
  dwell_s: 1.0
  joint_margin_deg: 0.5
  axes: [0, 1, 2, 3, 4, 5]
  amplitude_per_m: 13.5
workspace:
  # 与 playground 共用曲率/速率约束逐周期推进；记录稳定坐标和 PCC/MuJoCo 误差。
  seed: 20260910
  amplitudes_per_m: [3.0, 6.0, 9.0, 12.0, 15.0]
  # 半规模采集：每臂 61 + 1500 + 3*150 + 3*150 + 300 = 2761 点。
  combination_samples: 1500
  single_boundary_samples_per_group: 150
  double_boundary_samples_per_group: 150
  boundary_samples: 300
