[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confined-dual-continuum"
version = "0.1.0"
description = "面向受限空间的分阶段非对称双连续体协同控制"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "imageio[ffmpeg]>=2.34"]

[project.scripts]
cdc-run = "confined_dual_continuum.cli:main"

[project.optional-dependencies]
simulation = ["mujoco>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
